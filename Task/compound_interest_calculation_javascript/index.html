<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - Compound Interest Calculation</title>
</head>
<body>
    <script>
        const P =  1000; //Principal
        const r = 5; // Rate (%)
        const n = 2; // number of times interest is compounded per year
        const t = 3; //times (years)

        const A = P*( 1+ ((r/100)/n))**(n*t) // Amount
        console.log(A);

    </script>
</body>
</html>
