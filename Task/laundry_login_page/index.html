<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Laundry Login Page</title>
</head>
<body>
    <!-- Login Page -->
     <section class="container">
        <div class="page_left_box">
            <!-- <h2>hello</h2> -->
            <img src="./images/laundry.png" alt="Laundry_page">
        </div>
        <div class="page_right_box">
            <div class="form_title">
                <h1>Hello Again!</h1>
                <p>Welcome back! We missed you!</p>
            </div>
            <br/>
            <div class="form_data">
                <form action="">
                     <label for="email">Email</label>
                    <input type="email" placeholder="Email@site.com">

                     <label for="password">Password</label>
                    <input type="password" placeholder="Password">
                    <p class="forget_password">Forget Password</p>
                    <button>Login</button>
                </form>
                <div class="verify_member">
                    <p>Not a member? <a href="#">Register Now</a></p>
                </div>
                
            </div>
            
           
        </div>
     </section>
</body>
</html>
