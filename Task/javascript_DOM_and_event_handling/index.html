<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Javascript DOM and Event Handling</title>
</head>
<body>
    <header>
        <h2 class="title"> Hello <span id="title"></span> </h2>
    </header>

    <section class="color_box">
        <div class="box" id="red_box">Red</div>
        <div class="box" id="blue_box">Blue</div>
        <div class="box" id="green_box">Green</div>
        <div class="box" id="yellow_box">Yellow</div>
    </section>

    <section class="input_box">
        <form action="" id="nameForm">
            <div class="form_group">
                <input type="text" id="nameInput" placeholder="Enter Your Name..">
            </div>
            <button type="submit" class="btn-primary">Greet</button>
            
        </form>
        </section>
    
    <script src="script.js"></script>
</body>
</html>
