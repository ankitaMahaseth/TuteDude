
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Laundry Services</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md">

        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">

            <!-- Logo -->
            <div class="logo">
                <h2 class="text-3xl font-bold text-blue-600">
                    Logo
                </h2>
            </div>

            <!-- Navigation -->
            <nav>
                <ul class="flex flex-wrap justify-center items-center gap-5 font-medium">

                    <li>
                        <a href="/" class="hover:text-blue-600 transition">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="/about" class="hover:text-blue-600 transition">
                            About Us
                        </a>
                    </li>

                    <li>
                        <a href="/services" class="hover:text-blue-600 transition">
                            Services
                        </a>
                    </li>

                    

                    <li>
                        <a href="/contact" class="hover:text-blue-600 transition">
                            Contact Us
                        </a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>


    <!-- 404 Main Section -->
    <main class="flex-grow flex items-center justify-center px-6 py-5">

        <section class="max-w-3xl w-full text-center">

            <!-- 404 Number -->
            <div class="mb-2">

                <h1 class="text-8xl md:text-9xl font-extrabold text-blue-600">
                    404
                </h1>

                <div class="w-24 h-1.5 bg-blue-600 mx-auto rounded-full mt-4"></div>

            </div>


            <!-- Illustration -->
            <div class="text-5xl md:text-6xl mb-6">
                🧺
            </div>


            <!-- Heading -->
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
                Oops! Page Not Found
            </h2>


            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row justify-center gap-4">

                <a href="/"
                   class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition duration-300">

                    Back to Home

                </a>

            </div>


            <!-- Additional Message -->
            <p class="text-gray-500 text-sm mt-10">

                Need help with your laundry?
                <a href="/contact" class="text-blue-600 font-semibold hover:underline">
                    We're here to help!
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center">

        <p class="text-gray-500 text-sm">
            &copy; 2026 Laundry Services. All Rights Reserved.
        </p>

    </footer>
